<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreyaAdmin | Factory Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script>
      (function () {
        const redirect = window.location.search.match(/[?&]p=([^&]+)/);
        if (!redirect) return;
        const path = decodeURIComponent(redirect[1]).replace(/~and~/g, "&");
        const query = window.location.search.match(/[?&]q=([^&]+)/);
        const search = query ? "?" + decodeURIComponent(query[1]).replace(/~and~/g, "&") : "";
        const newUrl = window.location.pathname.replace(/\/$/, "") + path + search + window.location.hash;
        window.history.replaceState(null, "", newUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
