<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FreyaAdmin Redirect</title>
    <script>
      (function () {
        var segmentCount = 1;
        var location = window.location;
        var repoBase = location.pathname.split('/').slice(0, 1 + segmentCount).join('/');
        var rest = location.pathname.slice(repoBase.length).replace(/^\//, '');
        var target =
          repoBase +
          '/?p=/' +
          rest.replace(/&/g, '~and~') +
          (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash;
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
