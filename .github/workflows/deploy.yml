name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Validate and write production env
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CAM_USER: ${{ vars.VITE_CAM_USER }}
          VITE_CAM_PASS: ${{ vars.VITE_CAM_PASS }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL is empty. Set it in repository variables or in the github-pages environment."
            exit 1
          fi
          echo "VITE_API_URL=$VITE_API_URL" > .env.production
          echo "VITE_CAM_USER=$VITE_CAM_USER" >> .env.production
          echo "VITE_CAM_PASS=$VITE_CAM_PASS" >> .env.production
      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
